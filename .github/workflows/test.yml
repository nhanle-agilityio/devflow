name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - name: Node tests
        run: node --test tests/*.test.cjs
      - name: Hook tests
        run: python3 -m unittest discover -s hooks -p 'test_*.py' -v
